name: Deploy (Vercel, .com)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-vercel-com-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production-com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SITE_ORIGIN_EN: ${{ secrets.SITE_ORIGIN_EN }}
          SITE_ORIGIN_RU: ${{ secrets.SITE_ORIGIN_RU }}
          STATIC_EXPORT: "true"
          FORCE_LOCALE: "en"
          VERCEL_CLI_VERSION: "42.3.0"
        run: bash ./scripts/deploy/vercel.sh

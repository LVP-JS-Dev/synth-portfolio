name: CI
on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN_EN: https://example.com
      SITE_ORIGIN_RU: https://example.ru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
